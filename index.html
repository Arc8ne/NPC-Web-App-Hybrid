        height: 100%;
        padding: 0px 8px 8px 8px;

          width: fit-content;
        }

          margin: auto;
        }

      // Solid.js implementation
      function FileSelectionDialog(props) {
        const [filePath, setFilePath] = createSignal("");
        let rootRef;
        return html`
          <dialog
            ref=${
              (ref) => {
                rootRef = ref;
                props.ref(ref);
              }
            }
          >
            <div
              style=${
                {
                  "display": "flex",
                  "flex-direction": "column",
                  "row-gap": "8px"
                }
              }
            >
              <div
                style=${
                  {
                    "border-style": "solid",
                    "border-color": "black",
                    "border-width": "1px",
                    "padding": "64px"
                  }
                }
                onDragOver=${
                  (e) => e.preventDefault()
                }
                onDrop=${
                  async (e) => {
                    e.preventDefault();
                    let droppedFile = e.dataTransfer.files[0];
                    let droppedFileBytes = await droppedFile.arrayBuffer();
                    props.onFileSelected(droppedFileBytes);
                    rootRef.close();
                  }
                }
              >
                <span>Drag & drop a PDF file here</span>
              </div>
              <p
                style=${
                  {
                    "text-align": "center"
                  }
                }
              >--- or ---</p>
              <div class="input-field">
                <p>File path</p>
                <input
                  value=${filePath()}
                  onChange=${
                    (e) => {
                      setFilePath(e.target.value);
                    }
                  }
                />
              </div>
              <div
                style=${
                  {
                    "display": "flex",
                    "flex-direction": "row",
                    "column-gap": "8px",
                    "justify-content": "right"
                  }
                }
              >
                <button
                  onMouseUp=${
                    async (e) => {
                      let fileFetchResponse = await fetch(`file:///${filePath()}`);
                      if (!fileFetchResponse.ok) {
                        // TODO: Show a message indicating that no file at the specified path could be found.
                        throw new Error("The file at the specified path could not be found.");
                      }
                      props.onFileSelected(
                        await fileFetchResponse.arrayBuffer()
                      );
                      rootRef.close();
                    }
                  }
                >Ok</button>
                <button
                  onMouseUp=${
                    (e) => {
                      rootRef.close();
                    }
                  }
                >Cancel</button>
              </div>
            </div>
          </dialog>
        `;
      }

      function PdfViewer() {
        const [pdf, setPdf] = createSignal(null);
        const [pdfPages, setPdfPages] = createSignal([]);
        const [isLoading, setIsLoading] = createSignal(false);
        let fileSelectionDialogRef;
        return html`
          <div class="pdf-viewer">
            <h2>PDF Viewer</h2>
            <${Show}
              when=${() => !isLoading()}
              fallback=${html`<p>Loading PDF file...</p>`}
            >
              <button
                class="open-pdf-file-button"
                onMouseDown=${
                  (e) => {
                    fileSelectionDialogRef.showModal();
                  }
                }
              >Open PDF file</button>
            <//>
            <${For}
              each=${() => pdfPages()}
            >
              ${
                (pdfPage) => html`
                  <canvas
                    ref=${
                      async (pdfPageCanvas) => {
                        // Render the PDF page.
                        let viewport = pdfPage.getViewport(
                          {
                            scale: 1
                          }
                        );
                        let outputScale = window.devicePixelRatio || 1; // For supporting HiDPI screens
                        pdfPageCanvas.width = Math.floor(viewport.width * outputScale);
                        pdfPageCanvas.height = Math.floor(viewport.height * outputScale);
                        pdfPageCanvas.style.width = `${Math.floor(viewport.width)}px`;
                        pdfPageCanvas.style.height = `${Math.floor(viewport.height)}px`;
                        pdfPage.render(
                          {
                            canvasContext: pdfPageCanvas.getContext("2d"),
                            transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null,
                            viewport
                          }
                        );

                        // Extract all text from the PDF page via OCR.
                        let pdfPageTesseractWorker = await Tesseract.createWorker(
                          "eng",
                          1,
                          {
                            langPath: `${getCurrentFolderPath()}/tesseract-training-data`,
                            gzip: false
                          }
                        );
                        let result = await pdfPageTesseractWorker.recognize(pdfPageCanvas);

                        // DBG SCT
                        console.log("[DBG] Results of Tesseract.js recognition task:");
                        console.log(result);

                        await pdfPageTesseractWorker.terminate();
                      }
                    }
                  />
                `
              }
            <//>
            <${FileSelectionDialog}
              ref=${(someRef) => fileSelectionDialogRef = someRef}
              onFileSelected=${
                async (pdfFileData) => {
                  setIsLoading(true);
                  setPdf(
                    await pdfjsLib.getDocument(
                      {
                        data: pdfFileData
                      }
                    ).promise
                  );
                  setIsLoading(false);
                  let currentPdfPages = [];
                  for (let pageNumber = 1; pageNumber <= pdf().numPages; pageNumber++) {
                    let page = await pdf().getPage(pageNumber);
                    currentPdfPages.push(page);
                  }
                  setPdfPages(currentPdfPages);
                }
              }
            />
          </div>
        `;
      }

      function Terminal() {

      function NotFound() {

        return html`

            <${Route} path="/pdf-viewer" component=${() => PdfViewer}/>
            <${Route} path="/terminal" component=${() => Terminal}/>
            <${Route} path="*" component=${() => NotFound}/>
