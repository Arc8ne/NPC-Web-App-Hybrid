<!DOCTYPE html>
<html>
  <head>
    <title>NSPAC Web App</title>
    <style>
      * {
        margin: 0px;
      }

      body {
        font-family: Gordita, Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        row-gap: 0px;
        overflow-y: clip;
      }

      dialog::backdrop {
        background-color: rgba(1, 1, 1, 0.5);
      }

      .input-field {
        display: flex;
        flex-direction: column;
        row-gap: 4px;
      }

      .nav-bar {
        display: flex;
        flex-direction: row;
        column-gap: 8px;
        align-items: center;
        border-style: solid;
        border-color: black;
        border-width: 1px;
        padding: 8px;
      }

      .pdf-viewer {
        display: flex;
        flex-direction: column;
        row-gap: 8px;
        height: 100%;
        padding: 8px;

        .open-pdf-file-button, .close-pdf-file-button {
          width: fit-content;
        }

        .pdf-pages-canvases {
          .text-layer {
            span {
              position: relative;
              color: red;
            }
          }
        }

        dialog {
          margin: auto;
        }
      }
    </style>
  </head>
  <body>
    <noscript>JavaScript must be enabled.</noscript>

    <!-- tesseract.js - For performing OCR operations on images (including browser canvases) -->
    <script type="importmap">
      {
        "imports": {
          "solid-js": "https://cdn.jsdelivr.net/npm/solid-js@1.9.12/+esm",
          "solid-js/web": "https://cdn.jsdelivr.net/npm/solid-js@1.9.12/web/+esm",
          "solid-js/html": "https://cdn.jsdelivr.net/npm/solid-js@1.9.12/html/+esm",
          "solid-js/store": "https://cdn.jsdelivr.net/npm/solid-js@1.9.12/store/+esm",
          "@solidjs/router": "https://cdn.jsdelivr.net/npm/@solidjs/router@0.16.1/dist/index.min.js",
          "pdf.js": "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284/+esm",
          "tesseract.js": "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.esm.min.js"
        }
      }
    </script>

    <script type="module">
      import html from "solid-js/html";
      import { render } from "solid-js/web";
      import { HashRouter, Route, Navigate, A } from "@solidjs/router";
      import { createSignal, Show, For, Switch, Match } from "solid-js";
      import { createStore } from "solid-js/store";
      import * as pdfLib from "pdf.js";
      import tesseract from "tesseract.js";

      pdfLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284/build/pdf.worker.mjs";

      function getCurrentFilePath() {
        let currentFilePath = window.location.href.replace("file:///", "").split("#")[0];
        return currentFilePath;
      }

      function getCurrentFolderPath() {
        let currentFilePath = getCurrentFilePath();
        let lastPathSepIndex = currentFilePath.lastIndexOf("/");
        let currentFolderPath = currentFilePath.substring(0, lastPathSepIndex);
        return currentFolderPath;
      }

      function PageWrapper(props) {
        return html`
          <div class="nav-bar">
            <h1>NSPAC</h1>
            <${A} href="/pdf-viewer">PDF Viewer<//>
            <${A} href="/filesystem-searcher">Filesystem Searcher<//>
            <${A} href="/terminal">Terminal<//>
          </div>
          ${props.children}
        `;
      }

      function FileSelectionDialog(props) {
        const [filePath, setFilePath] = createSignal("");
        const [errorMessage, setErrorMessage] = createSignal(null);
        let rootRef;
        return html`
          <dialog
            ref=${
              (ref) => {
                rootRef = ref;
                props.ref(ref);
              }
            }
          >
            <div
              style=${
                {
                  "display": "flex",
                  "flex-direction": "column",
                  "row-gap": "8px"
                }
              }
            >
              <div
                style=${
                  {
                    "border-style": "solid",
                    "border-color": "black",
                    "border-width": "1px",
                    "padding": "64px"
                  }
                }
                onDragOver=${
                  (e) => e.preventDefault()
                }
                onDrop=${
                  async (e) => {
                    e.preventDefault();
                    let droppedFile = e.dataTransfer.files[0];
                    let droppedFileBytes = null;
                    try {
                      droppedFileBytes = await droppedFile.arrayBuffer();
                    } catch (error) {
                      // This code path will be reached if a folder is dragged over this element.
                      setErrorMessage("A folder was selected instead of a file.");
                      console.error(error);
                      return;
                    }
                    props.onFileSelected(droppedFileBytes);
                    rootRef.close();
                  }
                }
              >
                <p
                  style=${
                    {
                      "text-align": "center"
                    }
                  }
                >Drag & drop a file here</p>
              </div>
              <p
                style=${
                  {
                    "text-align": "center"
                  }
                }
              >--- or ---</p>
              <button
                onMouseUp=${
                  async (e) => {
                    let selectedFileHandle = null;
                    try {
                      selectedFileHandle = (await window.showOpenFilePicker())[0];
                    } catch (error) {
                      if (error.name == "AbortError") {
                        return;
                      }
                      console.error(error);
                    }
                    let selectedFile = await selectedFileHandle.getFile();
                    let selectedFileBytes = await selectedFile.arrayBuffer();
                    props.onFileSelected(selectedFileBytes);
                    rootRef.close();
                  }
                }
              >Select a file</button>
              <p
                style=${
                  {
                    "text-align": "center"
                  }
                }
              >--- or ---</p>
              <div class="input-field">
                <p>File path</p>
                <input
                  placeholder="Enter a file's path here"
                  value=${filePath()}
                  onChange=${
                    (e) => {
                      setFilePath(e.target.value);
                    }
                  }
                />
              </div>
              <div
                style=${
                  {
                    "display": "flex",
                    "flex-direction": "row",
                    "column-gap": "8px",
                    "justify-content": "right"
                  }
                }
              >
                <button
                  onMouseUp=${
                    async (e) => {
                      let fileFetchResponse = null;
                      try {
                        // If a file path is entered but it does not point to an existing file, then this line will throw an exception.
                        fileFetchResponse = await fetch(`file:///${filePath()}`);
                      } catch (error) {
                        setErrorMessage("The specified file could not be found.");
                        console.error(error);
                        return;
                      }
                      if (!fileFetchResponse.ok) {
                        // This code path will be reached if no file path (i.e. a blank value) is entered.
                        setErrorMessage("No file was selected.");
                        return;
                      }
                      props.onFileSelected(
                        await fileFetchResponse.arrayBuffer()
                      );
                      rootRef.close();
                    }
                  }
                >Ok</button>
                <button
                  onMouseUp=${
                    (e) => {
                      rootRef.close();
                    }
                  }
                >Cancel</button>
              </div>
              <${Show}
                when=${errorMessage}
              >
                <div
                  style=${
                    {
                      "display": "flex",
                      "flex-direction": "row",
                      "justify-content": "space-between",
                      "align-items": "center",
                      "background-color": "#D32F2F",
                      "color": "white",
                      "padding": "8px",
                      "column-gap": "8px"
                    }
                  }
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-x-icon lucide-circle-x"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
                  <p>${errorMessage}</p>
                  <button
                    style=${
                      {
                        "margin-left": "auto"
                      }
                    }
                    onMouseUp=${
                      (e) => setErrorMessage(null)
                    }
                  >Ok</button>
                </div>
              <//>
            </div>
          </dialog>
        `;
      }

      function renderPdfPageToCanvas(pdfPage, canvas) {
        let viewport = pdfPage.getViewport(
          {
            scale: 1
          }
        );
        let outputScale = window.devicePixelRatio || 1; // For supporting HiDPI screens
        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = `${Math.floor(viewport.width)}px`;
        canvas.style.height = `${Math.floor(viewport.height)}px`;
        pdfPage.render(
          {
            canvasContext: canvas.getContext("2d"),
            transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null,
            viewport
          }
        );
      }

      const [pdfViewerStore, setPdfViewerStore] = createStore(
        {
          // Can either be an array of PDF pages or 'loading' if a PDF's pages are being loaded.
          pdfPages: []
        }
      );

      function PdfViewer() {
        let fileSelectionDialogRef;
        return html`
          <div class="pdf-viewer">
            <h2>PDF Viewer</h2>
            <${Switch}>
              <${Match} when=${() => pdfViewerStore.pdfPages == "loading"}>
                <p>Loading PDF file...</p>
              <//>
              <${Match} when=${() => pdfViewerStore.pdfPages.length > 0}>
                <button
                  class="close-pdf-file-button"
                  onMouseUp=${
                    (e) => setPdfViewerStore("pdfPages", [])
                  }
                >Close</button>
                <div
                  class="pdf-pages-canvases"
                  style=${
                    {
                      "display": "flex",
                      "flex-direction": "column",
                      "row-gap": "8px",
                      "align-items": "center",
                      "padding": "0px 0px 8px 0px",
                      "height": "79%",
                      "overflow-y": "auto"
                    }
                  }
                >
                  <${For}
                    each=${() => pdfViewerStore.pdfPages}
                  >
                    ${
                      (pdfPage) => html`
                        <div
                          class="page"
                          style=${
                            {
                              "position": "relative"
                            }
                          }
                        >
                          <canvas
                            style=${
                              {
                                "border-style": "solid",
                                "border-width": "1px",
                                "border-color": "black"
                              }
                            }
                            ref=${
                              async (pdfPageCanvas) => {
                                renderPdfPageToCanvas(pdfPage, pdfPageCanvas);

                                // Extract all text from the PDF page via OCR.
                                let pdfPageTesseractWorker = await tesseract.createWorker(
                                  "eng",
                                  1,
                                  {
                                    langPath: `${getCurrentFolderPath()}/tesseract-training-data`,
                                    gzip: false
                                  }
                                );
                                let recognitionResult = await pdfPageTesseractWorker.recognize(pdfPageCanvas);
                                await pdfPageTesseractWorker.terminate();
                              }
                            }
                          />
                          <div
                            class="text-layer"
                            style=${
                              {
                                "position": "absolute",
                                "top": 0,
                                "left": 0
                              }
                            }
                            ref=${
                              async (pdfPageTextLayerRef) => {
                                // If the PDF is scanned (i.e. image-only) / contains no text content, then the `items` array in the returned object will be empty.
                                let pdfPageTextContent = await pdfPage.getTextContent();
                                let pdfPageTextLayer = new pdfLib.TextLayer(
                                  {
                                    textContentSource: pdfPageTextContent,
                                    viewport: pdfPage.getViewport(
                                      {
                                        scale: 1
                                      }
                                    ),
                                    container: pdfPageTextLayerRef
                                  }
                                );
                                await pdfPageTextLayer.render();
                              }
                            }
                          ></div>
                        </div>
                      `
                    }
                  <//>
                </div>
              <//>
              <${Match} when=${true}>
                <button
                  class="open-pdf-file-button"
                  onMouseUp=${
                    (e) => fileSelectionDialogRef.showModal()
                  }
                >Open</button>
              <//>
            <//>
            <${FileSelectionDialog}
              ref=${(someRef) => fileSelectionDialogRef = someRef}
              onFileSelected=${
                async (pdfFileData) => {
                  setPdfViewerStore("pdfPages", "loading");
                  let pdf = await pdfLib.getDocument(
                    {
                      data: pdfFileData
                    }
                  ).promise;
                  let currentPdfPages = [];
                  for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
                    let page = await pdf.getPage(pageNumber);
                    currentPdfPages.push(page);
                  }
                  setPdfViewerStore("pdfPages", currentPdfPages);
                }
              }
            />
          </div>
        `;
      }

      function Terminal() {
        return html`<div class="terminal"></div>`;
      }

      function NotFound() {
        return html`
          <div
            style=${
              {
                "display": "flex",
                "flex-direction": "column",
                "row-gap": "8px",
                "padding": "8px"
              }
            }
          >
            <h2>404 - Not Found</h2>
            <p>The requested page could not be found.</p>
          </div>
        `;
      }

      function NotImplementedYet() {
        return html`
          <div
            style=${
              {
                "display": "flex",
                "flex-direction": "column",
                "row-gap": "8px",
                "padding": "8px"
              }
            }
          >
            <h2>:(</h2>
            <p>This feature has not been implemented yet.</p>
          </div>
        `;
      }

      function App() {
        const defaultPath = "/pdf-viewer";
        return html`
          <${HashRouter} root=${PageWrapper}>
            <${Route}
              path="/"
              component=${
                () => () => html`<${Navigate} href=${defaultPath}/>`
              }
            />
            <${Route} path="/pdf-viewer" component=${() => PdfViewer}/>
            // TODO: Implement this.
            <${Route} path="/filesystem-searcher" component=${() => NotImplementedYet}/>
            <${Route} path="/terminal" component=${() => NotImplementedYet}/>
            <${Route} path="*" component=${() => NotFound}/>
          <//>
        `;
      }

      render(App, document.body);
    </script>
  </body>
</html>
